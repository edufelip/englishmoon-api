spring:
  application:
    name: englishmoon-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/englishmoon}
    username: ${SPRING_DATASOURCE_USERNAME:englishmoon}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

security:
  jwt:
    secret: ${SECURITY_JWT_SECRET:}
    access-token-ttl-minutes: 15
    issuer: englishmoon
    refresh-cookie-secure: false
    refresh-cookie-name: englishmoon_refresh
    refresh-cookie-same-site: Lax
    refresh-cookie-domain: ""
    refresh-token-ttl-days: 30
    max-refresh-tokens-per-user: 5
  password-reset:
    token-ttl: PT1H
    base-url: http://localhost:3000/reset-password

rate-limit:
  forgot-password:
    max-requests: 5
    window: PT10M
  login:
    max-requests: 20
    window: PT1M
  signup:
    max-requests: 10
    window: PT5M

logging:
  level:
    org.springframework.security: INFO
